spring:
  application:
    name: shop-api

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/shop_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
    default-encoding: UTF-8

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:ThisIsAVerySecureSecretKeyForEcommerceShopApi2024!!}
  expiration: 86400000

logging:
  level:
    com.ecommerce.shop_api: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:dm8ovqeot}
  api_key: ${CLOUDINARY_API_KEY:822811964694525}
  api_secret: ${CLOUDINARY_API_SECRET:b-IC4RuYtezz4WTjY8UlNsjYC18}

app:
  mail:
    from-name: ${MAIL_FROM_NAME:剣道ショップ}
    enabled: ${MAIL_ENABLED:true}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
